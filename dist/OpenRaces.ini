[Settings]
; 1 = randomize AI racers, 0 = leave the game alone
Enabled=1
; 1 = also give each randomized opponent a random paint colour
RandomizePaint=1
; 1 = never randomize the Most Wanted races (all 14, base game + DLC)
SkipMostWantedRaces=1
; 1 = every car can run every event; parts are only awarded in the event's original cars
AllEventsForAllCars=1
; 1 = recalculate the Races menu "NEW" flag from the original event lists
FixNewEventsFlag=1
; 1 = try not to give two opponents the same car in one race
AvoidDuplicateOpponents=1
; 1 = try not to give an opponent the same car you are driving
AvoidPlayerCar=1
; 1 = write OpenRaces.log next to this file
WriteLog=1
